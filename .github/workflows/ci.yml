name: TechOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Unit Tests (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore AssistenciaTech.sln

      - name: Build solution
        run: dotnet build AssistenciaTech.sln --configuration Release --no-restore

      - name: Run unit test suites
        run: dotnet test AssistenciaTech.sln --configuration Release --no-build --verbosity normal

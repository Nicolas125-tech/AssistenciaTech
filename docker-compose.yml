version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: techos-db
    restart: always
    environment:
      POSTGRES_USER: techos_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: techos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: techos_web
    ports:
      - "8080:8080"
    depends_on:
      - database
    environment:
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=techos_db;Username=techos_admin;Password=${POSTGRES_PASSWORD};
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/SecureUploads

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: assistenciatech_tunnel
    command: tunnel --url http://web:8080
    depends_on:
      - web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pgdata:

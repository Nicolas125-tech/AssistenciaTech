version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: techos-db
    restart: always
    environment:
      POSTGRES_USER: techos_admin
      POSTGRES_PASSWORD: SecretPassword123
      POSTGRES_DB: techos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: techos_web
    ports:
      - "8080:8080"
    depends_on:
      - database
    environment:
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=techos_db;Username=techos_admin;Password=SecretPassword123;
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: assistenciatech_tunnel
    command: tunnel --url http://web:8080
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
